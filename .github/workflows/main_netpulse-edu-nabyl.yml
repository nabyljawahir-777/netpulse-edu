name: Build and deploy NetPulse Edu to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Prepare Node.js for React/Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 2: Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # Step 3: Build React frontend
      - name: Build React frontend
        run: npm run build

      # Step 4: Verify frontend build
      - name: Verify frontend output
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "React frontend build verified."

      # Step 5: Copy React build into Java resources
      - name: Prepare Java static resources
        run: |
          mkdir -p src/main/resources/static
          rm -rf src/main/resources/static/assets
          cp -R dist/assets src/main/resources/static/
          cp dist/index.html src/main/resources/static/index.html

      # Step 6: Prepare Java 17
      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: 'maven'

      # Step 7: Package executable JAR
      - name: Build Java application
        run: mvn -B clean package

      # Step 8: Upload executable JAR
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/netpulse-edu-1.0.0.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 9: Download JAR
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      # Step 10: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C8186B77CD6B4C14AE93430934C2AF01 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9DE26B33490A4BD9B646A83763CA724D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_98B9E6BE29184489A143DBD07D724D39 }}

      # Step 11: Deploy to Azure App Service
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'netpulse-edu-nabyl'
          slot-name: 'Production'
          package: netpulse-edu-1.0.0.jar