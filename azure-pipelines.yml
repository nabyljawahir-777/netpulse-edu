# ==============================================================================
# Azure DevOps Pipeline - CI/CD for NetPulse Edu Java Application
# Target: Microsoft Azure App Service (Linux Web App) & Azure Container Apps
# Developer: Nabyl Jawahir (20250040073)
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - master

variables:
  azureSubscription: 'Azure-Subscription-ServiceConnection'
  webAppName: 'netpulse-edu-app'
  azureContainerRegistry: 'netpulseacr.azurecr.io'
  imageRepository: 'netpulse-edu-java'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: BuildAndTest
  displayName: 'Stage 1: Build & Package Java Application'
  jobs:
  - job: MavenBuild
    displayName: 'Maven Package JAR'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      displayName: 'Execute Maven Build & Unit Tests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: Docker@2
      displayName: 'Build and Push Docker Image to Azure Container Registry'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(azureSubscription)
        tags: |
          $(tag)
          latest

- stage: DeployToAzure
  displayName: 'Stage 2: Deploy to Microsoft Azure App Service'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy Web App Container'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Azure Web App on Linux Deployment'
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(webAppName)
        imageName: '$(azureContainerRegistry)/$(imageRepository):$(tag)'
        appSettings: |
          -WEBSITES_PORT 8080
          -PORT 8080
          -STUDENT_NAME "Nabyl Jawahir"
          -STUDENT_NIM "20250040073"
